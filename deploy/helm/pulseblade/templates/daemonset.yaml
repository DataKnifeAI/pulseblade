apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # emptyDir is root:root 0755. The image user cannot create the database
      # unless the pod runs as this group and kubelet chowns the volume.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: pulseblade
          image: {{ .Values.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$K8S_TOKEN" ] && [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
                export K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              fi
              exec pulseblade node --config /etc/pulseblade/pulseblade.toml
          env:
            - name: K8S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-k8s
                  key: token
                  optional: true
            - name: XDG_STATE_HOME
              value: /var/lib/pulseblade
          ports:
            - name: http
              containerPort: 7171
          volumeMounts:
            - name: config
              mountPath: /etc/pulseblade
              readOnly: true
            - name: state
              mountPath: /var/lib/pulseblade
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: state
          emptyDir: {}
