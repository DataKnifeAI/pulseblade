apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  pulseblade.toml: |
    listen = {{ .Values.listen | quote }}
    dashboard = true
    [k8s]
    api_url = {{ .Values.apiUrl | quote }}
    token_env = "K8S_TOKEN"
    cluster = {{ .Values.cluster | quote }}
    verify_tls = true
    ca = {{ .Values.ca | quote }}
