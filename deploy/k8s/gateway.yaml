# Pulseblade hub via Traefik Gateway API (HTTPRoute).
# TLS: traefik-gateway websecure uses kube-system/wildcard-dataknife-net-tls.
# DNS stays a CNAME to the worker record (no VIP change):
#   pulseblade-poc.dataknife.net  CNAME  poc-apps-wk.dataknife.net
# pb-hub-poc.dataknife.net stays as an extra hostname for one release.
#
#   curl -fsS https://pulseblade-poc.dataknife.net/
#   curl -fsS https://pulseblade-poc.dataknife.net/api/v1/status
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulseblade-hub
  namespace: pulseblade
  labels:
    app: pulseblade-hub
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - pulseblade-poc.dataknife.net
    - pb-hub-poc.dataknife.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pulseblade-hub
          port: 7170
