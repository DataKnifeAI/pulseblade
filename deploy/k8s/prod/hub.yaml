# Production hub on prd-apps. The fleet journal is CloudNativePG
# (pulseblade-postgres). The 80Gi PVC is the previous SQLite file; leave it
# until the postgres hub has caught up, then remove the mount.
# Apply this ConfigMap only with an image that reads database_url_env.
# Create the app secret before the cluster. The password is not in git:
#   kubectl -n pulseblade create secret generic pulseblade-postgres-credentials \
#     --from-literal=username=pulseblade --from-literal=password="$(openssl rand -base64 24)"
# Node tokens stay in the pulseblade-hub-tokens Secret (keys are node ids).
# This file has token env names only. Do not commit secret values.
# Image is digest-pinned off :poc so prod does not follow the POC tag.
apiVersion: v1
kind: Namespace
metadata:
  name: pulseblade
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseblade-hub
  namespace: pulseblade
data:
  pulseblade.toml: |
    allowed_hosts = [
      "pulseblade.dataknife.net",
      "pulseblade-hub",
      "pulseblade-hub.pulseblade",
      "pulseblade-hub.pulseblade.svc",
      "pulseblade-hub.pulseblade.svc.cluster.local",
    ]

    [hub]
    listen = "0.0.0.0:7170"
    action_wait_secs = 20
    database_url_env = "PULSEBLADE_DATABASE_URL"
    database_user_env = "PULSEBLADE_DATABASE_USER"
    database_password_env = "PULSEBLADE_DATABASE_PASSWORD"
    database_ca_env = "PULSEBLADE_DATABASE_CA"

    [[hub.nodes]]
    id = "prd-apps-1"
    token_env = "TOKEN_PRD_APPS_1"

    [[hub.nodes]]
    id = "prd-apps-2"
    token_env = "TOKEN_PRD_APPS_2"

    [[hub.nodes]]
    id = "prd-apps-3"
    token_env = "TOKEN_PRD_APPS_3"

    [[hub.nodes]]
    id = "prd-apps-large-worker-1"
    token_env = "TOKEN_PRD_APPS_LARGE_WORKER_1"

    [[hub.nodes]]
    id = "prd-apps-worker-1"
    token_env = "TOKEN_PRD_APPS_WORKER_1"

    [[hub.nodes]]
    id = "prd-apps-worker-2"
    token_env = "TOKEN_PRD_APPS_WORKER_2"

    [[hub.nodes]]
    id = "prd-apps-worker-3"
    token_env = "TOKEN_PRD_APPS_WORKER_3"

    [[hub.nodes]]
    id = "prd-apps-worker-4"
    token_env = "TOKEN_PRD_APPS_WORKER_4"

    [[hub.nodes]]
    id = "prd-apps-worker-5"
    token_env = "TOKEN_PRD_APPS_WORKER_5"

    [[hub.nodes]]
    id = "prd-apps-worker-6"
    token_env = "TOKEN_PRD_APPS_WORKER_6"

    [[hub.nodes]]
    id = "poc-apps-1"
    token_env = "TOKEN_POC_APPS_1"

    [[hub.nodes]]
    id = "poc-apps-2"
    token_env = "TOKEN_POC_APPS_2"

    [[hub.nodes]]
    id = "poc-apps-3"
    token_env = "TOKEN_POC_APPS_3"

    [[hub.nodes]]
    id = "poc-apps-worker-1"
    token_env = "TOKEN_POC_APPS_WORKER_1"

    [[hub.nodes]]
    id = "poc-apps-worker-2"
    token_env = "TOKEN_POC_APPS_WORKER_2"

    [[hub.nodes]]
    id = "poc-apps-worker-3"
    token_env = "TOKEN_POC_APPS_WORKER_3"

    [[hub.nodes]]
    id = "poc-apps-worker-4"
    token_env = "TOKEN_POC_APPS_WORKER_4"

    [[hub.nodes]]
    id = "poc-apps-worker-5"
    token_env = "TOKEN_POC_APPS_WORKER_5"

    [[hub.nodes]]
    id = "poc-apps-worker-6"
    token_env = "TOKEN_POC_APPS_WORKER_6"

    [[hub.nodes]]
    id = "nprd-apps-1"
    token_env = "TOKEN_NPRD_APPS_1"

    [[hub.nodes]]
    id = "nprd-apps-2"
    token_env = "TOKEN_NPRD_APPS_2"

    [[hub.nodes]]
    id = "nprd-apps-3"
    token_env = "TOKEN_NPRD_APPS_3"

    [[hub.nodes]]
    id = "nprd-apps-worker-1"
    token_env = "TOKEN_NPRD_APPS_WORKER_1"

    [[hub.nodes]]
    id = "nprd-apps-worker-2"
    token_env = "TOKEN_NPRD_APPS_WORKER_2"

    [[hub.nodes]]
    id = "nprd-apps-worker-3"
    token_env = "TOKEN_NPRD_APPS_WORKER_3"

    [[hub.nodes]]
    id = "nprd-apps-worker-4"
    token_env = "TOKEN_NPRD_APPS_WORKER_4"

    [[hub.nodes]]
    id = "nprd-apps-worker-5"
    token_env = "TOKEN_NPRD_APPS_WORKER_5"

    [[hub.nodes]]
    id = "nprd-apps-worker-6"
    token_env = "TOKEN_NPRD_APPS_WORKER_6"

    [[hub.nodes]]
    id = "rancher-manager-1"
    token_env = "TOKEN_RANCHER_MANAGER_1"

    [[hub.nodes]]
    id = "rancher-manager-2"
    token_env = "TOKEN_RANCHER_MANAGER_2"

    [[hub.nodes]]
    id = "rancher-manager-3"
    token_env = "TOKEN_RANCHER_MANAGER_3"

    [[hub.nodes]]
    id = "lee-cachy"
    token_env = "TOKEN_LEE_CACHY"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pulseblade-postgres
  namespace: pulseblade
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  enablePDB: true
  # truenas-csi-nfs is root-squashed, so kubelet applyFSGroup cannot chown
  # pgdata. Same override as the working authentik cluster: run as 26, no fsGroup.
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  storage:
    size: 80Gi
    storageClass: truenas-csi-nfs
  bootstrap:
    initdb:
      database: pulseblade
      owner: pulseblade
      secret:
        name: pulseblade-postgres-credentials
  postgresql:
    parameters:
      shared_buffers: "1GB"
      ssl_min_protocol_version: "TLSv1.3"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulseblade-hub
  namespace: pulseblade
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-csi-nfs
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseblade-hub
  namespace: pulseblade
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulseblade-hub
  template:
    metadata:
      labels:
        app: pulseblade-hub
    spec:
      # The journal is Postgres. This user is the process identity.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: pulseblade
          image: harbor.dataknife.net/library/pulseblade:0.1.0@sha256:ce5a6cf5198d17d93726c2bdc3b5d1f0beeca8188035d786b783fd35f7d4482d
          imagePullPolicy: IfNotPresent
          command:
            - pulseblade
            - hub
            - --config
            - /etc/pulseblade/pulseblade.toml
          env:
            - name: XDG_STATE_HOME
              value: /var/lib/pulseblade
            - name: PULSEBLADE_DATABASE_URL
              value: postgres://pulseblade-postgres-rw.pulseblade.svc.cluster.local:5432/pulseblade?sslmode=require
            - name: PULSEBLADE_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: pulseblade-postgres-credentials
                  key: username
            - name: PULSEBLADE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulseblade-postgres-credentials
                  key: password
            - name: PULSEBLADE_DATABASE_CA
              valueFrom:
                secretKeyRef:
                  name: pulseblade-postgres-ca
                  key: ca.crt
            - name: TOKEN_PRD_APPS_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-1
            - name: TOKEN_PRD_APPS_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-2
            - name: TOKEN_PRD_APPS_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-3
            - name: TOKEN_PRD_APPS_LARGE_WORKER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-large-worker-1
            - name: TOKEN_PRD_APPS_WORKER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-1
            - name: TOKEN_PRD_APPS_WORKER_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-2
            - name: TOKEN_PRD_APPS_WORKER_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-3
            - name: TOKEN_PRD_APPS_WORKER_4
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-4
            - name: TOKEN_PRD_APPS_WORKER_5
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-5
            - name: TOKEN_PRD_APPS_WORKER_6
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: prd-apps-worker-6
            - name: TOKEN_POC_APPS_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-1
            - name: TOKEN_POC_APPS_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-2
            - name: TOKEN_POC_APPS_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-3
            - name: TOKEN_POC_APPS_WORKER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-1
            - name: TOKEN_POC_APPS_WORKER_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-2
            - name: TOKEN_POC_APPS_WORKER_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-3
            - name: TOKEN_POC_APPS_WORKER_4
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-4
            - name: TOKEN_POC_APPS_WORKER_5
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-5
            - name: TOKEN_POC_APPS_WORKER_6
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-6
            - name: TOKEN_NPRD_APPS_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-1
            - name: TOKEN_NPRD_APPS_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-2
            - name: TOKEN_NPRD_APPS_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-3
            - name: TOKEN_NPRD_APPS_WORKER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-1
            - name: TOKEN_NPRD_APPS_WORKER_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-2
            - name: TOKEN_NPRD_APPS_WORKER_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-3
            - name: TOKEN_NPRD_APPS_WORKER_4
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-4
            - name: TOKEN_NPRD_APPS_WORKER_5
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-5
            - name: TOKEN_NPRD_APPS_WORKER_6
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: nprd-apps-worker-6
            - name: TOKEN_RANCHER_MANAGER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: rancher-manager-1
            - name: TOKEN_RANCHER_MANAGER_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: rancher-manager-2
            - name: TOKEN_RANCHER_MANAGER_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: rancher-manager-3
            - name: TOKEN_LEE_CACHY
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: lee-cachy
          ports:
            - name: http
              containerPort: 7170
          volumeMounts:
            - name: config
              mountPath: /etc/pulseblade
              readOnly: true
            - name: state
              mountPath: /var/lib/pulseblade
      volumes:
        - name: config
          configMap:
            name: pulseblade-hub
        - name: state
          persistentVolumeClaim:
            claimName: pulseblade-hub
---
apiVersion: v1
kind: Service
metadata:
  name: pulseblade-hub
  namespace: pulseblade
spec:
  type: ClusterIP
  selector:
    app: pulseblade-hub
  ports:
    - name: http
      port: 7170
      targetPort: http
---
# TLS is the existing rke2 nginx default certificate
# kube-system/wildcard-dataknife-net-tls (*.dataknife.net). Do not issue a
# new cert. DNS: pulseblade.dataknife.net CNAME prd-apps-wk.dataknife.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseblade-hub
  namespace: pulseblade
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: pulseblade.dataknife.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseblade-hub
                port:
                  number: 7170
