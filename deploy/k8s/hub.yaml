# Hub on poc-apps. The journal lives on a PVC so a rollout keeps state.
# Node tokens stay in the pulseblade-hub-tokens Secret (keys are node ids).
# The ConfigMap pulseblade-hub holds pulseblade.toml; its allow-list must
# include pulseblade-poc.dataknife.net or the Ingress returns 403.
# pb-hub-poc.dataknife.net stays for one release so old bookmarks still match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseblade-hub
  namespace: pulseblade
data:
  pulseblade.toml: |
    allowed_hosts = [
      "pulseblade-hub",
      "pulseblade-hub.pulseblade",
      "pulseblade-hub.pulseblade.svc",
      "pulseblade-hub.pulseblade.svc.cluster.local",
      "pulseblade-poc.dataknife.net",
      "pb-hub-poc.dataknife.net",
    ]

    [hub]
    listen = "0.0.0.0:7170"
    action_wait_secs = 20

    [[hub.nodes]]
    id = "poc-apps-1"
    token_env = "TOKEN_POC_APPS_1"

    [[hub.nodes]]
    id = "poc-apps-2"
    token_env = "TOKEN_POC_APPS_2"

    [[hub.nodes]]
    id = "poc-apps-3"
    token_env = "TOKEN_POC_APPS_3"

    [[hub.nodes]]
    id = "poc-apps-worker-1"
    token_env = "TOKEN_POC_APPS_WORKER_1"

    [[hub.nodes]]
    id = "poc-apps-worker-2"
    token_env = "TOKEN_POC_APPS_WORKER_2"

    [[hub.nodes]]
    id = "poc-apps-worker-3"
    token_env = "TOKEN_POC_APPS_WORKER_3"

    [[hub.nodes]]
    id = "poc-apps-worker-4"
    token_env = "TOKEN_POC_APPS_WORKER_4"

    [[hub.nodes]]
    id = "poc-apps-worker-5"
    token_env = "TOKEN_POC_APPS_WORKER_5"

    [[hub.nodes]]
    id = "poc-apps-worker-6"
    token_env = "TOKEN_POC_APPS_WORKER_6"

    [[hub.nodes]]
    id = "lee-cachy"
    token_env = "TOKEN_LEE_CACHY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulseblade-hub
  namespace: pulseblade
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseblade-hub
  namespace: pulseblade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulseblade-hub
  template:
    metadata:
      labels:
        app: pulseblade-hub
    spec:
      # NFS is root:root until fsGroup runs. The hub writes its sqlite
      # journal as this user.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: pulseblade
          image: harbor.dataknife.net/library/pulseblade:poc
          imagePullPolicy: Always
          command:
            - pulseblade
            - hub
            - --config
            - /etc/pulseblade/pulseblade.toml
          env:
            - name: XDG_STATE_HOME
              value: /var/lib/pulseblade
            - name: TOKEN_POC_APPS_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-1
            - name: TOKEN_POC_APPS_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-2
            - name: TOKEN_POC_APPS_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-3
            - name: TOKEN_POC_APPS_WORKER_1
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-1
            - name: TOKEN_POC_APPS_WORKER_2
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-2
            - name: TOKEN_POC_APPS_WORKER_3
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-3
            - name: TOKEN_POC_APPS_WORKER_4
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-4
            - name: TOKEN_POC_APPS_WORKER_5
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-5
            - name: TOKEN_POC_APPS_WORKER_6
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: poc-apps-worker-6
            - name: TOKEN_LEE_CACHY
              valueFrom:
                secretKeyRef:
                  name: pulseblade-hub-tokens
                  key: lee-cachy
          ports:
            - name: http
              containerPort: 7170
          volumeMounts:
            - name: config
              mountPath: /etc/pulseblade
              readOnly: true
            - name: state
              mountPath: /var/lib/pulseblade
      volumes:
        - name: config
          configMap:
            name: pulseblade-hub
        - name: state
          persistentVolumeClaim:
            claimName: pulseblade-hub
