<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulseblade</title>
<meta name="pulseblade-timezone" content="__PB_TIMEZONE__">
<link rel="icon" href="/favicon.ico" type="image/png">
<script>
(function () {
  var theme = "dark";
  try {
    var stored = localStorage.getItem("pulseblade-theme");
    if (stored === "light" || stored === "dark") theme = stored;
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark") theme = q;
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;
  document.documentElement.style.backgroundColor = theme === "light" ? "#f4efe6" : "#0b1020";
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020; --panel: #111a2b; --tint: #162036; --line: #24344d; --line-soft: #1a2639;
    --text: #e6ecf6; --muted: #8995ab; --faint: #7a869e;
    --amber: #f0a429; --amber-ink: #f6b84a; --amber-dim: rgba(240, 164, 41, .13);
    --ok: #2fcea8; --ok-ink: #49e0b8;
    --warn: #e8a317; --warn-ink: #f0b429; --warn-bg: rgba(232, 163, 23, .12);
    --bad: #e5484d; --bad-ink: #ff7070; --bad-bg: rgba(229, 72, 77, .13);
    --unknown: #6b7890; --meter: #3b4b6a; --track: #1d283f;
    --header: rgba(11, 16, 32, .92); --hover: #172238; --sel: #1f2a42;
    --sans: "IBM Plex Sans", "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "DejaVu Sans Mono", "Noto Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4efe6; --panel: #fffdf9; --tint: #f6efe3; --line: #e2d5c3; --line-soft: #ece2d3;
    --text: #221c16; --muted: #5f574f; --faint: #786d61;
    --amber: #c47f0a; --amber-ink: #8a5600; --amber-dim: rgba(176, 106, 12, .12);
    --ok: #0e7c6b; --ok-ink: #0b6b5c;
    --warn: #b86a08; --warn-ink: #8a4f04; --warn-bg: rgba(184, 106, 8, .10);
    --bad: #d3272d; --bad-ink: #a61b22; --bad-bg: rgba(211, 39, 45, .08);
    --unknown: #9a9087; --meter: #c9b99f; --track: #ece2d2;
    --header: rgba(250, 246, 239, .94); --hover: #f7f0e4; --sel: #f8e9cf;
  }
  /* three sizes: 20px numbers, 14px primary, 12px secondary */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  button, select, input { background: var(--tint); color: var(--text); border: 1px solid transparent; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; }
  button { cursor: pointer; }
  button:hover, select:hover, input:hover { border-color: var(--line); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  input::placeholder { color: var(--faint); }
  .mono, .num { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mono { overflow-wrap: anywhere; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .t-ok { color: var(--ok-ink); } .t-degraded { color: var(--warn-ink); } .t-failed { color: var(--bad-ink); } .t-unknown { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--unknown); }
  .dot.ok { background: var(--ok); opacity: .65; } .dot.degraded { background: var(--warn); } .dot.failed { background: var(--bad); }
  .linkish { background: none; border: 0; padding: 0; color: var(--amber-ink); font-size: 12px; }
  .linkish:hover { text-decoration: underline; border: 0; }

  header { position: sticky; top: 0; z-index: 5; background: var(--header); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
  .bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 24px 0; max-width: 1480px; margin: 0 auto; }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand .mark { color: var(--amber-ink); }
  .live { width: 18px; height: 18px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
  .mockbadge { font: 600 10px var(--mono); letter-spacing: .08em; color: var(--amber-ink); border: 1px dashed var(--amber); border-radius: 6px; padding: 1px 5px; }
  .spacer { flex: 1; }
  #q { width: 260px; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--tint); border-radius: 999px; }
  .seg button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; }
  .seg button[aria-pressed="true"] { background: var(--amber-dim); color: var(--amber-ink); }
  button[data-settings] { border: 0; background: var(--tint); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  button[data-settings]:hover { color: var(--text); }
  .settings label { display: grid; gap: 4px; margin: 10px 0; font-size: 12px; color: var(--muted); }
  .settings input, .settings select { width: 100%; }
  .settings .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .tabs { display: flex; gap: 22px; padding: 4px 24px 0; max-width: 1480px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    padding: 9px 0 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--text); border-color: transparent; border-bottom-color: var(--line); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--amber); }
  .badge { font: 600 12px/1 var(--mono); padding: 3px 7px; border-radius: 999px; background: var(--tint); color: var(--faint); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-ink); } .badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
  @media (max-width: 720px) {
    .bar { padding: 8px 14px 0; gap: 8px; }
    #q { order: 9; width: 100%; }
    .tabs { padding: 2px 14px 0; gap: 14px; }
    .tab { font-size: 13px; gap: 5px; }
  }

  .layout { max-width: 980px; margin: 0 auto; padding: 22px 24px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
  .layout.open { max-width: 1480px; grid-template-columns: minmax(0, 1fr) 430px; }
  .view { display: grid; gap: 18px; min-width: 0; align-content: start; }
  .card { background: var(--panel); border-radius: 14px; padding: 16px 18px; min-width: 0; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; display: flex; gap: 8px; align-items: center; }
  h3 { margin: 18px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .empty { color: var(--muted); padding: 2px 0; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px 30px; padding: 0 2px; }
  .stat { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; border-radius: 0; padding: 2px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .stat b { font: 600 20px/1 var(--mono); color: var(--faint); }
  .stat.bad b { color: var(--bad-ink); } .stat.warn b { color: var(--warn-ink); }
  .stat.bad, .stat.warn { color: var(--text); }
  .stat:disabled { cursor: default; }
  .stat.on { border-bottom-color: var(--amber); }
  .stat:not(:disabled):hover { border-color: transparent; border-bottom-color: var(--line); }

  .item { display: grid; grid-template-columns: 10px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 9rem) 3rem; gap: 2px 14px; align-items: center;
    padding: 9px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--sel); }
  .item .what b { font-weight: 600; }
  .item .what .sub { display: block; font-size: 12px; color: var(--muted); }
  .item .what .sub em { font-style: normal; color: var(--amber-ink); }
  .item .why { font-family: var(--mono); font-size: 12px; }
  .item .where { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .since { text-align: right; font-size: 12px; color: var(--faint); }
  @media (max-width: 720px) {
    .item { grid-template-columns: 10px minmax(0, 1fr) auto; }
    .item .why, .item .where { grid-column: 2 / 4; }
    .item .since { grid-row: 1; grid-column: 3; }
  }
  .sline { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 10px; padding: 10px 8px; margin: 0 -8px; width: calc(100% + 16px); text-align: left; font-size: 14px; color: var(--text); }
  .sline:hover { background: var(--hover); border-color: transparent; }
  .sline .muted { font-size: 12px; }
  .sline .right { margin-left: auto; font-size: 12px; }
  .sline .go { color: var(--faint); }

  .subnav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .group { padding: 4px 0; }
  .group + .group { margin-top: 6px; }
  .ghead { display: flex; align-items: center; gap: 8px; }
  .gline { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; background: none; border: 0; border-radius: 8px; padding: 6px 4px; text-align: left; font-size: 14px; color: var(--text); }
  .gline:hover { background: var(--hover); border-color: transparent; }
  .gline .caret { width: 10px; color: var(--faint); font-size: 10px; }
  .gline b { font-family: var(--mono); font-weight: 600; }
  .gline .gsum { color: var(--muted); font-size: 12px; }
  .gline .giss { margin-left: auto; font-size: 12px; white-space: nowrap; }
  .gbody { padding: 8px 0 6px 22px; display: grid; gap: 10px; }
  .gnote { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .gnote b { font-family: var(--mono); color: var(--text); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 10px; }
  .tile { text-align: left; display: grid; gap: 5px; padding: 10px 12px; border-radius: 10px; background: var(--tint); border: 1px solid transparent; color: var(--text); }
  .tile:hover { border-color: var(--line); }
  .tile.sel { border-color: var(--amber); }
  .tile.stale { opacity: .6; }
  .tname { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tname b { font-family: var(--mono); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tname .num { margin-left: auto; color: var(--faint); white-space: nowrap; }
  .meter { display: grid; grid-template-columns: 2.4rem 1fr 2.6rem; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); }
  .meter .num { text-align: right; color: var(--muted); }
  .meter .num.hot { color: var(--text); font-weight: 600; }
  .track { height: 3px; background: var(--track); border-radius: 9px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--meter); border-radius: inherit; }
  .track > i.warn { background: var(--warn); } .track > i.bad { background: var(--bad); }
  .tfoot { font-size: 12px; color: var(--faint); }
  @media (max-width: 720px) {
    .gbody { padding-left: 0; }
    .tiles { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .tile { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 10px; }
    .tile .tname, .tile .tfoot { grid-column: 1 / -1; }
    .meter { grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
  }

  .feed .ch { display: grid; grid-template-columns: 3rem 10px minmax(0, 1fr) minmax(0, 9rem); gap: 2px 12px; align-items: baseline; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
  .feed .ch:hover { background: var(--hover); }
  .feed .ch .dot { align-self: center; }
  .feed .ch .where { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .ch .what .small { color: var(--muted); }
  .feed .day { font-size: 12px; color: var(--faint); padding: 10px 0 2px; }
  @media (max-width: 720px) { .feed .ch { grid-template-columns: 3rem 10px minmax(0, 1fr); } .feed .ch .where { grid-column: 3; } }
  .note { font-size: 12px; color: var(--muted); padding-top: 8px; }

  .appr { display: grid; gap: 6px; padding: 14px 16px; border-radius: 12px; background: var(--tint); }
  .appr + .appr { margin-top: 10px; }
  .appr .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .appr .top b { font-family: var(--mono); }
  .appr .top .right { margin-left: auto; font-size: 12px; color: var(--amber-ink); }
  .run { display: grid; grid-template-columns: 10px 6.5rem minmax(0, 1fr) minmax(0, 1fr) 3rem; gap: 2px 12px; align-items: baseline; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .run:hover { background: var(--hover); }
  .run .dot { align-self: center; }
  .run .st { font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) { .run { grid-template-columns: 10px minmax(0, 1fr) auto; } .run .st { grid-column: 2; grid-row: 2; } .run .tgt { grid-column: 2 / 4; } }

  #panel { position: sticky; top: 104px; max-height: calc(100vh - 118px); overflow: auto; scrollbar-color: var(--line) transparent; }
  @media (max-width: 700px) {
    .layout.open { grid-template-columns: minmax(0, 1fr); }
    #panel:not([hidden]) { position: fixed; inset: 0; z-index: 8; max-height: none; border-radius: 0; }
  }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-bottom: 8px; }
  .crumb button { background: none; border: 0; padding: 0; color: var(--amber-ink); }
  .crumb .x { margin-left: auto; background: var(--tint); padding: 2px 10px; color: var(--muted); border-radius: 6px; }
  .ititle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ititle b { font-family: var(--mono); font-size: 14px; }
  .facts { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  .why-line { font-family: var(--mono); font-size: 12px; margin: 4px 0 10px; }
  .callout { border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: var(--tint); }
  .callout .lbl { font-size: 12px; font-weight: 600; }
  .callout.finding .lbl { color: var(--bad-ink); } .callout.approval .lbl { color: var(--amber-ink); }
  .callout .muted { font-size: 12px; }
  .callout pre { margin: 6px 0 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--tint); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .chip.on { background: var(--amber-dim); color: var(--amber-ink); }
  svg.spark { width: 100%; height: 64px; display: block; }
  .sparkmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .kind > button { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; border-radius: 6px; padding: 6px 2px; text-align: left; font-size: 14px; color: var(--text); }
  .kind > button:hover { background: var(--hover); border-color: transparent; }
  .kind > button .caret { width: 10px; color: var(--faint); font-size: 10px; }
  .kind > button .cnt { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .kind > button .st { margin-left: auto; font-size: 12px; white-space: nowrap; }
  .kind .body { padding: 0 0 6px 18px; }
  .kind .kind > button { padding: 3px 2px; font-family: var(--mono); font-size: 12px; min-width: 0; }
  .rrow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  .rrow:hover { background: var(--hover); }
  .rrow.sel { background: var(--sel); }
  .rrow .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .sm { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .rrow.u .nm { font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; margin: 0; font-size: 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

  footer { max-width: 1480px; margin: 0 auto; padding: 6px 24px 26px; color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  footer select { padding: 1px 6px; color: var(--muted); }
  footer .t-degraded { color: var(--warn-ink); }
  :root {
    --fx-ring: rgba(240, 164, 41, .10); --fx-grid: rgba(130, 160, 210, .06); --fx-arc: rgba(240, 164, 41, .16);
  }
  html[data-theme="light"] {
    --mk-tile: #fffdf9; --mk-edge: #e2d5c3; --mk-tower: #e6d8c3; --mk-tedge: #cdb998; --mk-arc: #c47f0a; --mk-head: #e09a1c; --mk-light: #0e7c6b;
    --fx-ring: rgba(150, 95, 20, .10); --fx-grid: rgba(120, 90, 50, .07); --fx-arc: rgba(196, 127, 10, .18);
  }
  .bgfx { position: absolute; top: 0; left: 0; width: 100%; height: 560px; z-index: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent); }
  .layout, footer { position: relative; z-index: 1; }
  .ic { width: 14px; height: 14px; flex: none; fill: currentColor; color: var(--faint); vertical-align: -2px; }
  .ic.lg { width: 16px; height: 16px; color: var(--muted); }
  .ln { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic.sm { width: 12px; height: 12px; vertical-align: -1px; margin-right: 5px; }
  .logo { width: 26px; height: 26px; display: block; }
  .live svg { width: 18px; height: 18px; display: block; overflow: visible; }
  .live .trk { fill: none; stroke: var(--line); stroke-width: 2; }
  .live .arc { fill: none; stroke: var(--amber); stroke-width: 2.4; stroke-linecap: round; transform-origin: 10px 10px; }
  .live .core { fill: var(--ok); transition: fill .3s; }
  header[data-health="degraded"] .live .core { fill: var(--warn); } header[data-health="failed"] .live .core { fill: var(--bad); }
  .paused .live .arc { stroke: var(--faint); } .paused .live .core { fill: var(--faint); }
  .sweep .live .arc { animation: spin 1.2s cubic-bezier(.3, .6, .3, 1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  header::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 32%; opacity: 0;
    background: linear-gradient(90deg, transparent, var(--amber), transparent); }
  header.sweep::after { animation: sweep 1.4s ease-out; }
  @keyframes sweep { 0% { transform: translateX(-100%); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateX(320%); opacity: 0; } }
  #panel:not([hidden]) { animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateX(14px); opacity: 0; } }
  .calm { display: flex; align-items: center; gap: 22px; padding: 22px 24px;
    background: radial-gradient(120% 160% at 0% 50%, color-mix(in srgb, var(--ok) 9%, transparent), transparent 60%), var(--panel); }
  .calmart { position: relative; width: 72px; height: 72px; flex: none; display: grid; place-items: center; --mk-arc: var(--ok); --mk-head: var(--ok-ink); }
  .calmart svg { width: 60px; height: 60px; position: relative; }
  .calmart i { position: absolute; inset: 6px; border-radius: 22px; border: 1px solid var(--ok); opacity: 0; animation: ring 4.5s ease-out infinite; }
  .calmart i + i { animation-delay: 2.25s; }
  @keyframes ring { 0% { transform: scale(.9); opacity: .45; } 100% { transform: scale(1.45); opacity: 0; } }
  .calm .big { font-size: 20px; font-weight: 600; color: var(--text); }
  .calm .scopesline { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .calm .scopesline span { display: inline-flex; align-items: center; gap: 6px; }
  footer .logo { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .calmart i { opacity: .25; transform: scale(1.15); }
  }

  html[data-theme="dark"] .mark-light { display: none; }
  html[data-theme="light"] .mark-dark { display: none; }
  .err { background: var(--bad-bg); color: var(--bad-ink); border-radius: 10px; padding: 8px 12px; }
</style>

function matcher(q) {

  const toks = normQ.split(/\s+/).filter(Boolean).reduce((out, t) => {
    const prev = out[out.length - 1];
    if (/^[<>]=?\d/.test(t) && prev && /^[a-z_.]+$/.test(prev) && !kindWord(prev)) out[out.length - 1] = prev + t; else out.push(t);
    return out;

    let m;

    else if ((m = t.match(/^is:(\w+)$/))) { const w = m[1]; tests.push(w === "unhealthy" ? bad : (r) => r.health === w || (r.attrs && r.attrs.status === w)); }

}

async function loadChanges() {
  const key = D.status.as_of_seq + ":" + state.win;
  if (state.changesKey === key) return;
  let since = state.win;
  const all = [];
  for (let i = 0; i < 4; i++) {
    const cs = await api(`/api/v1/changes?since=${encodeURIComponent(since)}&limit=250&compact=false`);
    all.push(...(cs.changes || []));
    if (!cs.truncated || !cs.next_cursor) break;
    since = cs.next_cursor;
  }
  D.changes = all;
  state.changesKey = key;

  }
}
async function ensureSpark() {
  const s = state.sel;
  if (!s || s.t !== "res") return;
  const r = byId.get(s.id);
  if (!r) return;
  const metric = chartMetric(r);
  if (!metric) return;
  const key = sparkKey(r.id, metric);
  if ((state.spark && state.spark.key === key) || state.sparkLoading === key) return;
  state.sparkLoading = key;
  try {
    const series = await api(`/api/v1/history?resource=${encodeURIComponent(r.id)}&metric=${encodeURIComponent(metric)}&since=1h`);
    if (state.sparkLoading !== key) return;
    state.spark = { key, series };
    if (M) renderPanel();
  } catch (e) {
    state.spark = { key, series: null };
  } finally {
    if (state.sparkLoading === key) state.sparkLoading = null;
  }
}
let refreshing = false;
async function loadPortal() {
  try {
    const p = await api("/api/v1/portal");
    if (p.health) state.health = Object.assign({}, HEALTH_DEFAULTS, p.health);
    if (zoneOk(p.timezone)) state.serverTz = p.timezone;
    let saved = null;
    try { saved = localStorage.getItem(TZ_KEY); } catch (e) {}
    if (!zoneOk(saved)) state.tz = state.serverTz || serverZone();
  } catch (e) {}
}
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const [status, snap, findings, actions] = await Promise.all([
      api("/api/v1/status"),
      api("/api/v1/snapshot"),
      api("/api/v1/findings?limit=20"),
      api("/api/v1/actions"),
      loadPortal(),
    ]);
    D.status = status;
    D.findings = findings || { total: 0, findings: [] };
    D.actions = actions || { runs: [] };
    D.counts = snap.counts || {};
    const detail = D.all.filter((r) => r.detail);
    D.all = [];
    byId = new Map();
    mergeResources(detail);
    mergeResources([].concat(snap.hosts || [], snap.resources || []));
    await enrich();
    render();
    sweep();
    ensureSpark();
    showError(null);
  } catch (e) {
    showError(e);
    if (!D.status) render();
  } finally {
    refreshing = false;
  }
}

function select(sel, keepMetric) {
  const same = sel && state.sel && sel.t === state.sel.t && sel.id === state.sel.id;
  state.sel = sel;
  if (!keepMetric && !(sel && sel.t === "res" && same)) state.metric = sel && sel.t === "res" ? state.metric : null;
  if (!keepMetric && sel && sel.t === "res" && !same) state.metric = null;
  render();
  const job = sel ? loadSel(sel).then(() => { render(); return ensureSpark(); }) : Promise.resolve();
  job.catch(showError);
  if (sel) { const p = $("panel"); if (p) p.scrollTop = 0; }
  syncUrl();
}
const sameSel = (t, id) => state.sel && state.sel.t === t && state.sel.id === id;
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tab],[data-strip],[data-gofleet],[data-fleet],[data-win],[data-machine],[data-scope],[data-g],[data-res],[data-kind],[data-showok],[data-metric],[data-close],[data-churn],[data-attnall],[data-attnless],[data-preset],[data-theme-choice],[data-settings]");
  if (!t) return;
  const d = t.dataset;
  if (d.themeChoice) return setTheme(d.themeChoice);
  if (d.settings !== undefined) return select(sameSel("settings", "settings") ? null : { t: "settings", id: "settings" });
  if (d.tab) { state.tab = d.tab; render(); enrich().then(render).catch(showError); return syncUrl(); }
  if (d.gofleet) { state.tab = "fleet"; state.fleet = d.gofleet; render(); enrich().then(render).catch(showError); return syncUrl(); }
  if (d.fleet) { state.fleet = d.fleet; render(); return syncUrl(); }
  if (d.win) { state.win = d.win; state.changesKey = ""; loadChanges().then(render).catch(showError); return; }
  if (d.strip) { state.filter = state.filter === d.strip ? null : d.strip; return render(); }
  if (d.close !== undefined) { $("q").value = ""; return select(null); }
  if (d.preset) { $("q").value = d.preset; return select({ t: "search", id: d.preset }); }
  if (d.attnall !== undefined) { state.attnAll = true; return render(); }
  if (d.attnless !== undefined) { state.attnAll = false; return render(); }
  if (d.churn !== undefined) { state.churn = !state.churn; return render(); }
  if (d.metric) { state.metric = d.metric; state.spark = null; render(); ensureSpark(); return syncUrl(); }
  if (d.g) { state.open["g:" + d.g] = t.getAttribute("aria-expanded") !== "true"; return render(); }
  if (d.kind) { state.open[d.kind] = t.getAttribute("aria-expanded") !== "true"; return render(); }
  if (d.showok) { state.showOk[d.showok] = true; return render(); }
  if (d.machine) return select(sameSel("machine", d.machine) ? null : { t: "machine", id: d.machine });
  if (d.scope) return select(sameSel("scope", d.scope) ? null : { t: "scope", id: d.scope });
  if (d.res) return select({ t: "res", id: d.res });
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement !== $("q")) { ev.preventDefault(); $("q").focus(); }
  else if (ev.key === "Escape") { $("q").value = ""; $("q").blur(); select(null); }
  else if (ev.key === "Enter" && ev.target.matches && ev.target.matches(".item")) ev.target.click();
});
let searchTimer = null;
$("q").oninput = () => {
  const v = $("q").value.trim();
  state.sel = { t: "search", id: v };
  render();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { loadSearch(v).then(render).catch(showError); }, 180);
};
$("q").onfocus = () => { if (!state.sel || state.sel.t !== "res") select({ t: "search", id: $("q").value.trim() }, true); };

function decorate() {
  const r = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join("");
  $("bgfx").innerHTML = `<g fill="none" stroke="var(--fx-ring)">${[120, 240, 390, 570, 780].map((v) => `<circle cx="720" cy="64" r="${v}"/>`).join("")}</g>`
    + `<g stroke="var(--fx-grid)">${r(16, (i) => `<path d="M720 64L${i * 240 - 1080} 560"/>`)}${[118, 150, 196, 262, 356, 490].map((y) => `<path d="M0 ${y}H1440"/>`).join("")}</g>`
    + `<path d="M990 560C760 470 650 320 720 64" fill="none" stroke="var(--fx-arc)" stroke-width="3" stroke-linecap="round"/>`;
}
decorate();

function setTheme(theme) {
  theme = theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;
  document.documentElement.style.backgroundColor = theme === "light" ? "#f4efe6" : "#0b1020";
  try { localStorage.setItem("pulseblade-theme", theme); } catch (e) {}
  document.querySelectorAll("[data-theme-choice]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeChoice === theme)));
  const p = new URLSearchParams(location.search);
  if (p.get("theme") && p.get("theme") !== theme) {
    p.set("theme", theme);
    history.replaceState(null, "", "?" + p.toString());
  }
}
setTheme(document.documentElement.getAttribute("data-theme"));

function sweep() {
  const h = $("hdr");
  h.classList.remove("sweep"); void h.offsetWidth; h.classList.add("sweep");
}
function schedule() {
  clearInterval(state.timer);
  if (!state.paused) state.timer = setInterval(refresh, state.interval * 1000);
}
$("live").onclick = () => {
  state.paused = !state.paused;
  $("hdr").classList.toggle("paused", state.paused);
  $("live").title = state.paused ? "Paused · click to resume" : "Live · click to pause";
  $("live").setAttribute("aria-label", state.paused ? "Resume live refresh" : "Pause live refresh");
  schedule();
  if (D.status) renderFoot();
};

if (TABS.some(([k]) => k === params.get("tab"))) state.tab = params.get("tab");
if (["k8s", "pve", "host", "all"].includes(params.get("fleet"))) state.fleet = params.get("fleet");
if (["15m", "1h", "6h", "24h"].includes(params.get("win"))) state.win = params.get("win");
if (params.get("filter")) state.filter = params.get("filter");
const initialQ = [params.get("kind") ? "kind:" + params.get("kind") : "", params.get("q") || ""].filter(Boolean).join(" ");
if (initialQ) $("q").value = initialQ;
if (params.get("select")) state.sel = { t: "res", id: params.get("select") };
else if (initialQ) state.sel = { t: "search", id: initialQ };
refresh();
schedule();

</script>
