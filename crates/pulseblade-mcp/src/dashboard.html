<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulseblade</title>
<script>
(function () {
  var theme = "dark";
  try {
    var stored = localStorage.getItem("pulseblade-theme");
    if (stored === "light" || stored === "dark") theme = stored;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;
  document.documentElement.style.backgroundColor = theme === "light" ? "#f4efe6" : "#0b1020";
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --glow-amber: rgba(240, 164, 41, .10);
    --glow-navy: #1a2744;
    --panel: #141c2f;
    --panel-end: #10182a;
    --panel2: #1c2740;
    --line: #2c3d5c;
    --line-soft: #24344f;
    --text: #e8eef8;
    --muted: #93a0b8;
    --amber: #f0a429;
    --amber-ink: #f6b84a;
    --amber-dim: rgba(240, 164, 41, .16);
    --ok: #2fcea8;
    --ok-ink: #49e0b8;
    --warn: #e8a317;
    --warn-ink: #f0b429;
    --bad: #e5484d;
    --bad-ink: #ff7070;
    --unknown: #7d8ba3;
    --header: rgba(11, 16, 32, .88);
    --hover: #1c2944;
    --sel: #2a334c;
    --spark: #0c1424;
    --err-bg: #3c1820;
    --err-fg: #ffd4d4;
    --row-line: #1c2942;
    --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset;
    --lane: linear-gradient(90deg, transparent, var(--amber) 20%, var(--amber) 80%, transparent);
    --sans: "IBM Plex Sans", "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "DejaVu Sans Mono", "Noto Sans Mono", "Liberation Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4efe6;
    --glow-amber: rgba(176, 106, 12, .14);
    --glow-navy: #efe2cc;
    --panel: #fffdf9;
    --panel-end: #f7f2e8;
    --panel2: #f0e6d6;
    --line: #e2d5c3;
    --line-soft: #eadfce;
    --text: #221c16;
    --muted: #6d645b;
    --amber: #c47f0a;
    --amber-ink: #8a5600;
    --amber-dim: rgba(176, 106, 12, .16);
    --ok: #0e7c6b;
    --ok-ink: #0b6b5c;
    --warn: #b86a08;
    --warn-ink: #8a4f04;
    --bad: #d3272d;
    --bad-ink: #a61b22;
    --unknown: #8a8178;
    --header: rgba(255, 252, 247, .92);
    --hover: #f6efe3;
    --sel: #f8e6c6;
    --spark: #fffaf3;
    --err-bg: #fdeceb;
    --err-fg: #8c1d22;
    --row-line: #efe4d4;
    --shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 1px 2px rgba(70, 48, 16, .04);
    --lane: linear-gradient(90deg, transparent, #e0a02a 18%, #c47f0a 50%, #e0a02a 82%, transparent);
  }
  html { background: var(--bg); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(880px 380px at 88% -140px, var(--glow-amber), transparent 62%),
      radial-gradient(1100px 480px at 8% -200px, var(--glow-navy), transparent 58%),
      var(--bg);
    color: var(--text);
    font: 14px/1.4 var(--sans);
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--lane);
    z-index: 6;
    pointer-events: none;
  }
  ::selection { background: var(--amber-dim); color: var(--text); }
  header {
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: var(--header); position: sticky; top: 0; z-index: 4;
    backdrop-filter: blur(10px);
  }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
  .brand .mark { color: var(--amber-ink); }
  .pulse {
    width: 9px; height: 9px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 2.2s ease-out infinite;
  }
  .paused .pulse { animation: none; opacity: .35; box-shadow: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240, 164, 41, .55); }
    70% { box-shadow: 0 0 0 9px rgba(240, 164, 41, 0); }
    100% { box-shadow: 0 0 0 0 rgba(240, 164, 41, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 8px; }
  button, select, input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; font-weight: 600; }
  button:hover, select:hover, input:hover { border-color: var(--amber); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 1px;
  }
  input::placeholder { color: var(--muted); }
  .theme-switch {
    display: inline-flex; padding: 2px; gap: 2px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
  }
  .theme-switch button {
    border: 0; background: transparent; color: var(--muted);
    border-radius: 999px; padding: 3px 11px; line-height: 1.3;
  }
  .theme-switch button:hover { border-color: transparent; color: var(--text); }
  html[data-theme="dark"] .theme-switch [data-theme-choice="dark"],
  html[data-theme="light"] .theme-switch [data-theme-choice="light"] {
    background: var(--amber-dim); color: var(--amber-ink);
    box-shadow: inset 0 0 0 1px var(--amber);
  }
  main { padding: 14px 18px 28px; display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
  section {
    background: linear-gradient(180deg, var(--panel), var(--panel-end));
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; min-width: 0; box-shadow: var(--shadow);
  }
  section.attention { box-shadow: inset 3px 0 0 var(--warn), var(--shadow); }
  #detail-panel.has-sel { box-shadow: inset 3px 0 0 var(--amber), var(--shadow); border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
  .c7, #detail-panel { align-self: start; }
  h2 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 1100px) { .c3, .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }
  .ok { background: var(--ok); } .degraded { background: var(--warn); } .failed { background: var(--bad); } .unknown { background: var(--unknown); }
  .t-ok { color: var(--ok-ink); } .t-degraded { color: var(--warn-ink); } .t-failed { color: var(--bad-ink); } .t-unknown { color: var(--muted); }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 5px 2px; border-bottom: 1px dashed var(--line-soft); min-width: 0; }
  .row:last-child { border-bottom: 0; }
  .row.click:hover { background: var(--hover); border-radius: 6px; }
  #unhealthy .row {
    display: grid;
    grid-template-columns: auto 4.75rem minmax(0, 22rem) minmax(0, 1fr);
    align-items: center;
    justify-items: start;
    column-gap: 12px;
  }
  @media (max-width: 720px) {
    #unhealthy .row { grid-template-columns: auto 4.75rem minmax(0, 1fr); }
    #unhealthy .muted { grid-column: 1 / -1; padding-left: 1.4rem; }
  }
  #unhealthy .spacer { display: none; }
  .row.health-failed, .row.health-degraded { border-bottom-style: solid; border-radius: 6px; padding-left: 8px; margin: 2px 0; }
  .row.health-failed { background: rgba(229, 72, 77, .10); border-color: rgba(229, 72, 77, .28); }
  .row.health-degraded { background: rgba(232, 163, 23, .10); border-color: rgba(232, 163, 23, .28); }
  html[data-theme="light"] .row.health-failed { background: rgba(211, 39, 45, .08); border-color: rgba(166, 27, 34, .22); }
  html[data-theme="light"] .row.health-degraded { background: rgba(184, 106, 8, .10); border-color: rgba(138, 79, 4, .22); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
  .metric { margin-bottom: 7px; }
  .lbl { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .lbl b { color: var(--text); font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    padding: 4px 8px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--row-line); vertical-align: top; }
  tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--hover); }
  tr.sel { background: var(--sel) !important; box-shadow: inset 3px 0 0 var(--amber); }
  .scroll { max-height: 420px; overflow: auto; scrollbar-color: var(--line) transparent; }
  .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
  .chip:hover { border-color: var(--amber); }
  .chip.on { border-color: var(--amber); color: var(--amber-ink); background: var(--amber-dim); }
  .chip b { font-family: var(--mono); font-weight: 600; }
  .counts td.num { text-align: right; }
  .err { background: var(--err-bg); border: 1px solid var(--bad); color: var(--err-fg); padding: 8px 12px; border-radius: 8px; grid-column: span 12; }
  .empty { color: var(--muted); padding: 6px 0; }
  .filters { display: flex; gap: 8px; margin-bottom: 8px; } .filters input { flex: 1; min-width: 0; }
  svg.spark { width: 100%; height: 120px; display: block; background: var(--spark); border: 1px solid var(--line); border-radius: 8px; }
  .chg-changed { color: var(--amber-ink); } .chg-appeared { color: var(--ok-ink); } .chg-disappeared { color: var(--bad-ink); }
  #detail .row b.mono { font-size: 13px; }
  #detail .kv { grid-template-columns: auto auto; justify-content: start; column-gap: 18px; }
  #detail .kv dd { text-align: left; }
</style>
</head>
<body>
<header id="hdr">
  <div class="brand"><span class="pulse" aria-hidden="true"></span>Pulse<span class="mark">blade</span></div>
  <span class="meta" id="hdr-meta">loading…</span>
  <span class="spacer"></span>
  <span class="meta" id="updated"></span>
  <div class="controls">
    <div class="theme-switch" role="group" aria-label="Color theme">
      <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    </div>
    <select id="interval" title="Refresh interval" aria-label="Refresh interval">
      <option value="5">5s</option><option value="15" selected>15s</option><option value="60">60s</option>
    </select>
    <button type="button" id="toggle">Pause</button>
  </div>
</header>
<main id="main">
  <div class="err" id="err" hidden></div>
  <section class="c3"><h2>Pulseblade</h2><dl class="kv" id="self"></dl></section>
  <section class="c3"><h2>Collectors</h2><div id="collectors"></div></section>
  <section class="c3"><h2>Host</h2><div id="hosts"></div></section>
  <section class="c3"><h2>Resources by kind</h2><table class="counts"><thead><tr><th>Kind</th><th style="text-align:right">Total</th>
    <th style="text-align:right">Failed</th><th style="text-align:right">Degraded</th></tr></thead><tbody id="counts"></tbody></table></section>
  <section class="c12" id="unhealthy-sec"><h2>Unhealthy <span class="right muted" id="unhealthy-n"></span></h2><div id="unhealthy"></div></section>
  <section class="c7">
    <h2>Resources <span class="right muted" id="res-n"></span></h2>
    <div class="filters"><select id="kind" aria-label="Kind"><option value="">all kinds</option></select>
      <input id="q" placeholder="filter by id or name…" aria-label="Filter resources"></div>
    <div class="scroll"><table><thead><tr><th></th><th>Resource</th><th>State</th></tr></thead><tbody id="resources"></tbody></table></div>
  </section>
  <section class="c5" id="detail-panel">
    <h2>Details <span class="right"><select id="range" aria-label="Metric range"><option>15m</option><option selected>1h</option><option>6h</option><option>24h</option></select></span></h2>
    <div id="detail"><div class="empty">Select a resource to see its attributes, metrics, and recent changes.</div></div>
  </section>
  <section class="c6"><h2>Findings <span class="right muted" id="findings-n"></span></h2><div id="findings"></div></section>
  <section class="c6"><h2>Actions <span class="right muted" id="actions-n"></span></h2><div id="actions"></div></section>
  <section class="c12">
    <h2>Recent changes <span class="right"><select id="window" aria-label="Changes window"><option>15m</option><option selected>1h</option><option>6h</option><option>24h</option><option>7d</option></select></span></h2>
    <div class="scroll"><table><thead><tr><th>Time</th><th>Seq</th><th>Resource</th><th>Change</th></tr></thead><tbody id="changes"></tbody></table></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Deep links: ?kind=service&q=ssh&select=<resource id>&metric=<metric>
const link = new URLSearchParams(location.search);
const state = { timer: null, paused: false, resources: [], selected: link.get("select"),
  metric: link.get("metric"), kind: link.get("kind") || "" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function syncThemePressed() {
  const theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  document.querySelectorAll("[data-theme-choice]").forEach((b) => {
    b.setAttribute("aria-pressed", b.getAttribute("data-theme-choice") === theme ? "true" : "false");
  });
}
document.querySelectorAll("[data-theme-choice]").forEach((b) => {
  b.addEventListener("click", () => {
    const theme = b.getAttribute("data-theme-choice") === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme;
    document.documentElement.style.backgroundColor = theme === "light" ? "#f4efe6" : "#0b1020";
    try { localStorage.setItem("pulseblade-theme", theme); } catch (e) {}
    syncThemePressed();
  });
});
syncThemePressed();

async function api(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  const body = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function bytes(n) {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (Math.abs(n) >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : Math.round(n)) + " " + u[i];
}
function fmt(metric, v) {
  if (v == null) return "–";
  if (metric.endsWith("_pct")) return v.toFixed(1) + "%";
  if (metric.endsWith("bytes_per_s")) return bytes(v) + "/s";
  if (metric.endsWith("_bytes")) return bytes(v);
  return Number.isInteger(v) ? String(v) : v.toFixed(2);
}
function ago(secs) {
  if (secs == null) return "–";
  if (secs < 60) return secs + "s ago";
  if (secs < 3600) return Math.round(secs / 60) + "m ago";
  if (secs < 86400) return (secs / 3600).toFixed(1) + "h ago";
  return (secs / 86400).toFixed(1) + "d ago";
}
function dur(secs) {
  if (secs == null) return "–";
  const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${secs % 60}s`;
}
const time = (ts) => new Date(ts).toLocaleTimeString();
const dot = (h) => `<span class="dot ${esc(h)}" title="${esc(h)}"></span>`;
const rid = (id) => `<span class="mono">${esc(id)}</span>`;
const showError = (e) => { $("err").hidden = !e; $("err").textContent = e ? "Could not reach Pulseblade: " + e.message : ""; };

function summary(r) {
  const m = r.metrics || {}, a = r.attrs || {};
  switch (r.kind) {
    case "host": return `cpu ${fmt("cpu.used_pct", m["cpu.used_pct"])} · mem ${fmt("mem.used_pct", m["mem.used_pct"])} · load ${fmt("load.1m", m["load.1m"])}`;
    case "disk": return `${fmt("disk.used_pct", m["disk.used_pct"])} used · ${fmt("disk.available_bytes", m["disk.available_bytes"])} free`;
    case "net_iface": return `rx ${fmt("net.rx_bytes_per_s", m["net.rx_bytes_per_s"])} · tx ${fmt("net.tx_bytes_per_s", m["net.tx_bytes_per_s"])}`;
    case "service": return [a.active, a.sub, a.unit_file_state].filter(Boolean).join(" · ");
    case "process": return `cpu ${fmt("proc.cpu_pct", m["proc.cpu_pct"])} · mem ${fmt("proc.mem_pct", m["proc.mem_pct"])}`;
    case "session": return [a.user, a.state, a.linger === "yes" ? "linger" : ""].filter(Boolean).join(" · ");
    case "container": return [a.state, a.health, a.image].filter(Boolean).join(" · ");
    case "image": return a.image_id || "";
    case "vm": return [a.status, a.vmid != null ? "id " + a.vmid : ""].filter(Boolean).join(" · ");
    case "node": return a.status || "";
    case "storage": return [a.kind, a.active === false ? "inactive" : ""].filter(Boolean).join(" · ");
    case "pod": return [a.phase, a.namespace].filter(Boolean).join(" · ");
    case "workload": return [a.kind, a.ready].filter(Boolean).join(" · ");
    default: return Object.keys(m).slice(0, 2).map((k) => `${k} ${fmt(k, m[k])}`).join(" · ");
  }
}

function renderStatus(s) {
  $("hdr-meta").textContent = `v${s.version} · seq ${s.as_of_seq}`;
  $("self").innerHTML = [
    ["Version", s.version], ["Uptime", dur(s.uptime_secs)], ["Journal seq", s.as_of_seq],
    ["Resources", s.resources.total], ["Open findings", s.open_findings ?? 0],
    ["Awaiting approval", s.awaiting_actions ?? 0],
    ["Samples", s.samples.toLocaleString()], ["Changes", s.changes.toLocaleString()],
    ["Checkpoints", s.checkpoints], ["Database", bytes(s.db.size_bytes)],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("") +
    (s.db.path ? `<dt>Path</dt><dd class="mono muted" title="${esc(s.db.path)}">${esc(s.db.path.split("/").pop())}</dd>` : "");
  $("collectors").innerHTML = s.collectors.length ? s.collectors.map((c) => `
    <div class="row">${dot(c.ok ? "ok" : c.stale ? "degraded" : "failed")}<b>${esc(c.source)}</b>
      <span class="spacer"></span><span class="muted num">${ago(c.age_secs)} · ${c.duration_ms} ms · ${c.resource_count} res</span></div>
    ${c.error ? `<div class="t-failed mono">${esc(c.error)}</div>` : ""}
    ${c.stale ? `<div class="t-degraded">stale: no pass in ${ago(c.age_secs).replace(" ago", "")}</div>` : ""}`).join("")
    : `<div class="empty">No collector runs recorded yet.</div>`;
  $("counts").innerHTML = Object.entries(s.resources.by_kind).map(([k, c]) => `
    <tr><td>${esc(k)}</td><td class="num">${c.total}</td>
    <td class="num ${c.failed ? "t-failed" : "muted"}">${c.failed || 0}</td>
    <td class="num ${c.degraded ? "t-degraded" : "muted"}">${c.degraded || 0}</td></tr>`).join("");
}

function renderHosts(list) {
  const hosts = list.filter((r) => r.kind === "host");
  $("hosts").innerHTML = hosts.length ? hosts.map((h) => {
    const m = h.metrics || {};
    const bar = (k, label) => {
      const v = m[k]; if (v == null) return "";
      const color = v >= 90 ? "var(--bad)" : v >= 75 ? "var(--warn)" : "var(--ok)";
      return `<div class="metric"><div class="lbl"><span>${label}</span><b>${fmt(k, v)}</b></div>
        <div class="bar"><i style="width:${Math.min(100, v)}%;background:${color}"></i></div></div>`;
    };
    return `<div class="row">${dot(h.health)}<b>${esc(h.name || h.id.slice(5))}</b><span class="spacer"></span>
      <span class="muted">load ${fmt("load.1m", m["load.1m"])} / ${fmt("load.5m", m["load.5m"])} / ${fmt("load.15m", m["load.15m"])}</span></div>
      ${bar("cpu.used_pct", "CPU")}${bar("mem.used_pct", "Memory")}${bar("swap.used_pct", "Swap")}
      <div class="lbl muted">available memory <b>${fmt("mem.available_bytes", m["mem.available_bytes"])}</b></div>`;
  }).join("") : `<div class="empty">No host resource.</div>`;
}

function renderUnhealthy(list) {
  const bad = list.filter((r) => r.health === "failed" || r.health === "degraded");
  $("unhealthy-sec").classList.toggle("attention", bad.length > 0);
  $("unhealthy-n").textContent = bad.length ? `${bad.length} resource(s)` : "";
  $("unhealthy").innerHTML = bad.length ? bad.map((r) => `
    <div class="row click health-${esc(r.health)}" data-id="${esc(r.id)}">${dot(r.health)}
      <span class="t-${esc(r.health)}">${esc(r.health)}</span>${rid(r.id)}<span class="spacer"></span>
      <span class="muted">${esc(summary(r))}</span></div>`).join("")
    : `<div class="empty t-ok">Everything reporting is healthy.</div>`;
}

function renderActions(page) {
  const runs = (page && page.runs) || [];
  $("actions-n").textContent = runs.length ? String(runs.length) : "";
  $("actions").innerHTML = runs.length ? runs.map((a) =>
    `<div class="row"><span class="muted">${esc(a.status)}</span><b>${esc(a.action)}</b>
      <span class="mono">${esc(a.resource_id)}</span><span class="spacer"></span>
      <span class="muted">${esc(a.tier || "")}</span></div>`).join("")
    : `<div class="empty">No actions recorded.</div>`;
}

function renderFindings(page) {
  const rows = (page && page.findings) || [];
  $("findings-n").textContent = page && page.total ? `${page.total} open` : "";
  $("findings").innerHTML = rows.length ? rows.map((f) => `
    <div class="row click" data-id="${esc(f.resource_id)}">
      <span class="t-${f.severity === "critical" ? "failed" : f.severity === "warning" ? "degraded" : "unknown"}">${esc(f.severity)}</span>
      ${rid(f.resource_id)}<span class="muted">${esc(f.rule)}</span><span class="spacer"></span>
      <span>${esc(f.summary)}</span></div>`).join("")
    : `<div class="empty t-ok">No open findings.</div>`;
}

function renderResources() {
  const kind = $("kind").value, q = $("q").value.trim().toLowerCase();
  const rows = state.resources.filter((r) => (!kind || r.kind === kind) &&
    (!q || r.id.toLowerCase().includes(q) || (r.name || "").toLowerCase().includes(q)));
  $("res-n").textContent = `${rows.length} of ${state.resources.length}`;
  $("resources").innerHTML = rows.map((r) => `
    <tr class="click ${r.id === state.selected ? "sel" : ""}" data-id="${esc(r.id)}">
      <td>${dot(r.health)}</td><td>${rid(r.id)}</td><td class="muted">${esc(summary(r))}</td></tr>`).join("");
}

function fillKinds(list) {
  const sel = $("kind"), cur = sel.value || state.kind;
  state.kind = "";
  const kinds = [...new Set(list.map((r) => r.kind))].sort();
  sel.innerHTML = `<option value="">all kinds</option>` + kinds.map((k) => `<option ${k === cur ? "selected" : ""}>${esc(k)}</option>`).join("");
}

function changeText(c) {
  const v = (x) => x == null ? "∅" : typeof x === "object" ? (x.health ? `${x.kind} ${x.health}` : JSON.stringify(x)) : String(x);
  if (c.kind === "changed") return `${esc(c.field)}: ${esc(v(c.before))} → ${esc(v(c.after))}`;
  return c.kind === "appeared" ? `appeared (${esc(v(c.after))})` : `disappeared (was ${esc(v(c.before))})`;
}

async function refreshChanges() {
  const cs = await api(`/api/v1/changes?since=${encodeURIComponent($("window").value)}&limit=1000&compact=false`);
  const list = cs.changes.slice().reverse().slice(0, 300);
  $("changes").innerHTML = list.length ? list.map((c) => `
    <tr class="click" data-id="${esc(c.resource_id)}"><td class="num muted">${time(c.ts)}</td><td class="num muted">${c.seq}</td>
    <td>${rid(c.resource_id)}</td><td class="chg-${esc(c.kind)}">${changeText(c)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No changes in this window.</td></tr>`;
}

function spark(series) {
  const vals = series.values, present = vals.filter((v) => v != null);
  if (!present.length) return `<div class="empty">No samples in range.</div>`;
  const W = 600, H = 120, P = 8, min = Math.min(...present), max = Math.max(...present), span = max - min || 1;
  const x = (i) => P + (vals.length < 2 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (vals.length - 1));
  const y = (v) => H - P - (v - min) / span * (H - 2 * P);
  let d = "", dots = "", pen = false;
  vals.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    const p = `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
    d += `${pen ? "L" : "M"}${p} `;
    if (!pen && vals[i + 1] == null) dots += `M${p} l0.01,0 `;
    pen = true;
  });
  const s = series.stats;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="${dots}" stroke="var(--amber)" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="muted num" style="display:flex;justify-content:space-between;margin-top:4px">
      <span>min ${fmt(series.metric, s.min)}</span><span>avg ${fmt(series.metric, s.avg)}</span>
      <span>max ${fmt(series.metric, s.max)}</span><span>last <b style="color:var(--text)">${fmt(series.metric, s.last)}</b></span>
      <span>step ${series.step_secs}s</span></div>`;
}

async function refreshDetail() {
  const id = state.selected;
  $("detail-panel").classList.toggle("has-sel", !!id);
  if (!id) return;
  const e = await api(`/api/v1/resources/${encodeURIComponent(id)}?changes_limit=10`);
  const r = e.resource, metrics = Object.keys(e.metrics);
  if (!metrics.includes(state.metric)) state.metric = metrics[0] || null;
  let chart = "";
  if (state.metric) {
    const s = await api(`/api/v1/metrics?id=${encodeURIComponent(id)}&metric=${encodeURIComponent(state.metric)}&range=${$("range").value}`);
    chart = spark(s);
  }
  const kv = (obj) => Object.entries(obj || {}).map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd class="mono">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</dd>`).join("");
  $("detail").innerHTML = `
    <div class="row">${dot(r.health)}<b class="mono">${esc(r.id)}</b><span class="spacer"></span><span class="t-${esc(r.health)}">${esc(r.health)}</span></div>
    <dl class="kv" style="margin:8px 0">
      <dt>kind</dt><dd>${esc(r.kind)}</dd><dt>source</dt><dd>${esc(r.source)}</dd>
      ${r.parent ? `<dt>parent</dt><dd class="mono">${esc(r.parent)}</dd>` : ""}
      <dt>first seen</dt><dd>${esc(new Date(r.first_seen).toLocaleString())}</dd>
      ${e.children.total ? `<dt>children</dt><dd>${e.children.total} (${e.children.unhealthy.length} unhealthy)</dd>` : ""}
      ${kv(r.labels)}${kv(r.attrs)}</dl>
    ${metrics.length ? `<div class="chips" style="margin-bottom:8px">${metrics.map((m) =>
      `<span class="chip ${m === state.metric ? "on" : ""}" data-metric="${esc(m)}">${esc(m)} <b>${fmt(m, e.metrics[m].value)}</b></span>`).join("")}</div>${chart}` : ""}
    <h2 style="margin-top:12px">Recent changes here and on parent</h2>
    ${e.recent_changes.length ? e.recent_changes.map((c) => `<div class="row"><span class="muted num">${time(c.ts)}</span>
      ${rid(c.resource_id === r.id ? "" : c.resource_id)}<span class="chg-${esc(c.kind)}">${changeText(c)}</span></div>`).join("")
      : `<div class="empty">None retained.</div>`}
    ${(e.findings || []).length ? `<h2 style="margin-top:12px">Findings</h2>` + e.findings.map((f) =>
      `<div class="row"><span class="t-${f.severity === "critical" ? "failed" : "degraded"}">${esc(f.severity)}</span>
      <span>${esc(f.summary)}</span></div>` + (f.logs || []).slice(0, 3).map((l) =>
        `<div class="muted mono">${esc(l.message)}</div>`).join("")).join("") : ""}
    ${(e.notes || []).length ? `<h2 style="margin-top:12px">Notes</h2>` + e.notes.map((n) =>
      `<div class="row"><span class="muted">${esc(n.author)}</span><span>${esc(n.text)}</span></div>`).join("") : ""}
    ${(e.actions || []).length ? `<h2 style="margin-top:12px">Prior actions</h2>` + e.actions.map((a) =>
      `<div class="row"><span class="muted">${esc(a.status)}</span><span>${esc(a.action)}</span></div>`).join("") : ""}`;
}

function select(id) {
  state.selected = id; state.metric = null;
  renderResources();
  refreshDetail().catch(showError);
  if (window.innerWidth < 1100) $("detail-panel").scrollIntoView({ behavior: "smooth" });
}

async function refresh() {
  try {
    const [status, snap, findings, actions] = await Promise.all([
      api("/api/v1/status"), api("/api/v1/snapshot?detail=full&limit=500"),
      api("/api/v1/findings?limit=20"), api("/api/v1/actions")]);
    state.resources = snap.resources;
    renderStatus(status); renderHosts(snap.resources); renderUnhealthy(snap.resources);
    renderFindings(findings); renderActions(actions);
    fillKinds(snap.resources); renderResources();
    await Promise.all([refreshChanges(), refreshDetail()]);
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
    showError(null);
  } catch (e) { showError(e); }
}

function schedule() {
  clearInterval(state.timer);
  if (!state.paused) state.timer = setInterval(refresh, Number($("interval").value) * 1000);
}

document.addEventListener("click", (ev) => {
  const chip = ev.target.closest("[data-metric]");
  if (chip) { state.metric = chip.dataset.metric; refreshDetail().catch(showError); return; }
  const row = ev.target.closest("[data-id]");
  if (row) select(row.dataset.id);
});
$("toggle").onclick = () => {
  state.paused = !state.paused;
  $("toggle").textContent = state.paused ? "Resume" : "Pause";
  $("hdr").classList.toggle("paused", state.paused);
  schedule(); if (!state.paused) refresh();
};
$("interval").onchange = schedule;
$("kind").onchange = renderResources;
$("q").oninput = renderResources;
$("window").onchange = () => refreshChanges().catch(showError);
$("range").onchange = () => refreshDetail().catch(showError);
$("q").value = link.get("q") || "";
refresh(); schedule();
</script>
</body>
</html>
