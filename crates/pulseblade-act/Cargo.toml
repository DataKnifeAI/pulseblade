[package]
name = "pulseblade-act"
description = "Pulseblade remediation: schema'd, idempotent, gated, audited actions (M3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:tokio", "dep:http", "dep:rustls"]

[dependencies]
pulseblade-core.workspace = true
pulseblade-store.workspace = true
chrono.workspace = true
jsonschema = { version = "0.58", default-features = false }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls"] }
native-tls = "0.2"
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"], optional = true }
k8s-openapi = { version = "0.28.0", features = ["v1_32"], optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "time", "net", "io-util"] }
http = { version = "1.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[dev-dependencies]
tempfile.workspace = true
