[package]
name = "pulseblade"
description = "Agent-first infrastructure monitor: MCP-native telemetry, change checkpoints, and gated remediation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pulseblade-core.workspace = true
pulseblade-store.workspace = true
pulseblade-collect.workspace = true
pulseblade-detect.workspace = true
pulseblade-act.workspace = true
pulseblade-mcp.workspace = true
pulseblade-pilot.workspace = true
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["docker", "proxmox", "k8s"]
docker = ["pulseblade-collect/docker"]
proxmox = ["pulseblade-collect/proxmox"]
k8s = ["pulseblade-collect/k8s", "pulseblade-act/k8s"]

[dev-dependencies]
rcgen = "0.13"

[[example]]
name = "seed_demo"
test = true
