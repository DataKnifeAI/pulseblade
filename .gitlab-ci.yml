# Publish deploy/Dockerfile to Harbor.
# Registry host, project, and credentials are group CI/CD variables
# (HARBOR_REGISTRY, HARBOR_PROJECT, HARBOR_USERNAME, HARBOR_PASSWORD,
# DOCKER_AUTH_CONFIG). Nothing secret belongs in this file.
stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  tags:
    - kubernetes
  timeout: 2h
  # Cold release builds take long enough that a newer main push was
  # canceling this job before the image reached Harbor.
  interruptible: false
  # The nprd runner defaults to 1 CPU / 2Gi and allows a job to raise
  # itself up to these caps. BuildKit does not see the GitLab cache, so
  # dependency reuse is the registry layer cache in the script below.
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -euo pipefail
      if [ -z "${HARBOR_REGISTRY:-}" ] || [ -z "${HARBOR_PROJECT:-}" ]; then
        echo "HARBOR_REGISTRY and HARBOR_PROJECT CI variables are required"
        exit 1
      fi
      DEST="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/pulseblade"
      SHA_TAG="${CI_COMMIT_SHORT_SHA:-$CI_PIPELINE_ID}"
      OUTPUT_FLAGS="--output type=image,name=${DEST}:${SHA_TAG},push=true"
      if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
        OUTPUT_FLAGS="${OUTPUT_FLAGS} --output type=image,name=${DEST}:poc,push=true"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        OUTPUT_FLAGS="${OUTPUT_FLAGS} --output type=image,name=${DEST}:${CI_COMMIT_TAG},push=true"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=deploy/Dockerfile \
        --metadata-file image-metadata.json \
        --import-cache type=registry,ref="${DEST}:buildcache",ignore-error=true \
        --export-cache type=registry,ref="${DEST}:buildcache",mode=max \
        ${OUTPUT_FLAGS}
      digest=$(sed -n 's/.*"containerimage.digest"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' image-metadata.json | head -n 1)
      if [ -z "${digest}" ]; then
        echo "image digest missing from build metadata"
        exit 1
      fi
      printf '%s\n' "${digest}" > image-digest.txt
      echo "pushed ${DEST}@${digest}"
